<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ברכת שנה טובה - מנט"מ</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="script.js" defer></script>
    
    <!-- הגדרות תצוגה מקדימה לוואטסאפ -->
    <meta property="og:title" content="שנה טובה ממטה ייצור מנט&quot;מ - צוות NLOS">
    <meta property="og:description" content="לחצו על הכפתור לשיגור הברכה לשנה החדשה!">
    <meta property="og:image" content="https://eliranshmilo-arch.github.io/nlos-shana-tova/background.jpg">
    <meta property="og:type" content="website">
</head>
<body>
    <div id="container">
        <!-- כותרת עליונה -->
        <div id="top-instruction">לחצו על הכפתור האדום ושגרו ברכה לשנה החדשה</div>

        <!-- חלונית המטרה -->
        <img id="target-window" src="target.jpg" alt="פגיעה במטרה">

        <!-- הטיל -->
        <img id="missile" src="missile.png" alt="טיל נגד טנקים">

        <!-- טקסט הברכה -->
        <div id="blessing-text">
            <h3><span class="red-text">צוות NLOS</span> מאחל :</h3>
            <h1>שנה טובה ומנצחת!</h1>
            <h2>שנמשיך להשיג את המטרות המשותפות.</h2>
        </div>

        <!-- כפתור השיגור -->
        <div id="launch-btn-wrapper">
            <div class="btn-label" id="btn-text">לחץ על הכפתור לשיגור ברכה.</div>
            <div id="launch-btn"></div>
        </div>
    </div>
</body>
</html>
